version: "3.9"

services:
  app:
    build: .
    image: bbq-pizza:latest
    container_name: bbq-pizza
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8182}:8000"
    environment:
      - APP_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - MANAGER_PASSWORD=${MANAGER_PASSWORD}
      - MANAGER_SECRET=${MANAGER_SECRET}
      - MANAGER_TOKEN=${MANAGER_TOKEN}
      - PUBLIC_URL=${PUBLIC_URL}
    volumes:
      # Persistent SQLite database + WAL files
      - bbq_data:/app/data
      # Persistent uploaded/food images (seeded on first run from the image)
      - bbq_images:/app/static/images/food
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bbq_data:
  bbq_images:
