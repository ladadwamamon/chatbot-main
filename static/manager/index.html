<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>المنصة — إدارة المطاعم</title>
  <link rel="stylesheet" href="/static/manager/manager.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-mark">⌘</div>
      <div class="login-kicker">Control plane</div>
      <h1>منصة المطاعم</h1>
      <p>دخول صاحب المنصة — ليست لوحة المطعم</p>
      <form id="login-form">
        <input type="password" id="login-password" placeholder="كلمة مرور المنصة" required autofocus autocomplete="current-password">
        <button type="submit" class="btn primary block">دخول</button>
        <div id="login-error" class="error-msg hidden"></div>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">⌘</div>
        <div>
          <div class="brand-name">المنصة</div>
          <div class="brand-tag">إدارة المطاعم</div>
        </div>
      </div>
      <nav class="side-nav">
        <a href="#/" data-view="dashboard">الملخص</a>
        <a href="#/venues" data-view="venues">المطاعم</a>
        <a href="#/venues/new" data-view="wizard">إضافة مطعم</a>
        <a href="#/errors" data-view="errors">الأخطاء <span class="dot" id="badge-errors" hidden></span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="env-pill" id="env-pill">hub</div>
        <button id="logout-btn" class="side-link">خروج</button>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn" aria-label="القائمة">☰</button>
        <div>
          <div class="crumb" id="crumb">المنصة</div>
          <h2 id="view-title">الملخص</h2>
        </div>
        <div class="top-actions">
          <button class="btn ghost" id="ping-all-btn" title="فحص كل السيرفرات">فحص الكل</button>
          <a class="btn primary" href="#/venues/new">+ مطعم جديد</a>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="sidebar-backdrop" class="backdrop hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/manager/manager.js"></script>
</body>
</html>
